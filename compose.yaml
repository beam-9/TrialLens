name: triallens
services:
  ollama:
    image: ollama/ollama:0.32.14
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    # The client intentionally uses 127.0.0.1:11434. Share this network
    # namespace instead of exposing inference or changing that boundary.
    network_mode: service:ollama
    environment:
      TRIALLENS_CHAT_PROVIDER: ollama
      TRIALLENS_LOCAL_MODEL: ${TRIALLENS_LOCAL_MODEL:-qwen3.5:9b}
      TRIALLENS_USAGE_PATH: /app/data/usage.sqlite3
    volumes:
      - data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 15s
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      TRIALLENS_API_BASE: http://ollama:8000
    ports:
      - "127.0.0.1:${TRIALLENS_WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    restart: unless-stopped
volumes:
  models:
  data:
